name: Claim Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-check fixtures
        run: python3 claimgate.py --self-check
      - name: Judge claim.json when present
        id: judge
        run: |
          mkdir -p out
          if [ -f claim.json ]; then
            python3 claimgate.py --claim claim.json --out out || true
            echo "has_claim=true" >> "$GITHUB_OUTPUT"
          else
            echo ADMIT > out/verdict.txt
            printf '%s\n' '## Claim Gate' '' 'No claim.json. Fixture self-check passed.' > out/comment.md
            echo "has_claim=false" >> "$GITHUB_OUTPUT"
          fi
          echo "verdict=$(tr -d '\n' < out/verdict.txt)" >> "$GITHUB_OUTPUT"
      - name: Comment on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('out/comment.md', 'utf8');
            const text = '<!-- claim-gate -->\n' + body;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const previous = comments.find((c) => c.body && c.body.includes('<!-- claim-gate -->'));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body: text,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: text,
              });
            }
      - name: Fail closed on a submitted claim
        if: steps.judge.outputs.has_claim == 'true'
        run: |
          verdict=$(tr -d '\n' < out/verdict.txt)
          echo "verdict=$verdict"
          [ "$verdict" = "ADMIT" ] || exit 1

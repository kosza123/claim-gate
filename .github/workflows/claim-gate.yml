name: Claim Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Production self-check
        run: python3 gate.py --self-check
      - name: Judge this PR with the Action
        if: github.event_name == 'pull_request'
        uses: ./

name: Claim Gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-check fixtures
        run: python3 claimgate.py --self-check
      - name: Judge claim.json
        run: |
          mkdir -p out
          python3 gate.py --claim claim.json --law LAW.md --out out || true
          test -f out/comment.md || echo '## Claim Gate' > out/comment.md
          cat out/comment.md
      - uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          header: claim-gate
          path: out/comment.md
      - name: Fail closed
        run: test "$(tr -d '\n' < out/verdict.txt)" = "ADMIT"

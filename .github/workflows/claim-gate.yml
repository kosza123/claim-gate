name: Claim Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-check fixtures
        run: python3 claimgate.py --self-check
      - name: Judge claim.json when present
        id: judge
        run: |
          mkdir -p out
          if [ -f claim.json ]; then
            python3 gate.py --claim claim.json --out out || true
            echo "has_claim=true" >> "$GITHUB_OUTPUT"
          else
            echo ADMIT > out/verdict.txt
            printf '%s\n' '## Claim Gate' '' 'No claim.json. Fixture self-check passed.' > out/comment.md
            echo "has_claim=false" >> "$GITHUB_OUTPUT"
          fi
          test -f out/comment.md || echo '## Claim Gate' > out/comment.md
          test -f out/verdict.txt || echo INCOMPLETE > out/verdict.txt
          echo "verdict=$(tr -d '\n' < out/verdict.txt)" >> "$GITHUB_OUTPUT"
          cat out/comment.md
      - uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          header: claim-gate
          path: out/comment.md
      - name: Fail closed on a submitted claim
        if: steps.judge.outputs.has_claim == 'true'
        run: test "$(tr -d '\n' < out/verdict.txt)" = "ADMIT"

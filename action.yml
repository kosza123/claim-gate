name: Claim Gate
description: Fail-closed judge. Policy from base ref. Verdicts in RUNNER_TEMP.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Judge
      shell: bash
      env:
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        RUN_ID: ${{ github.run_id }}
        EVENT: ${{ github.event_name }}
      run: |
        set -euo pipefail
        OUT="${RUNNER_TEMP}/claim-gate"
        rm -rf "$OUT"
        mkdir -p "$OUT"
        ACTION="${{ github.action_path }}"

        resolve_law() {
          if [ "$EVENT" = "pull_request" ] && [ -n "${BASE_REF:-}" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF" 2>/dev/null || true
            if git cat-file -e "origin/${BASE_REF}:LAW.md" 2>/dev/null; then
              git show "origin/${BASE_REF}:LAW.md" > "$OUT/LAW.md"
              return 0
            fi
            if [ -n "${BASE_SHA:-}" ] && git cat-file -e "${BASE_SHA}:LAW.md" 2>/dev/null; then
              git show "${BASE_SHA}:LAW.md" > "$OUT/LAW.md"
              return 0
            fi
            echo INCOMPLETE > "$OUT/verdict.txt"
            printf '%s\n' '## Claim Gate' '' '**INCOMPLETE** — no LAW.md on the base ref. Policy cannot come from this PR.' > "$OUT/comment.md"
            return 1
          fi
          if [ -f LAW.md ]; then
            cp LAW.md "$OUT/LAW.md"
            return 0
          fi
          echo INCOMPLETE > "$OUT/verdict.txt"
          printf '%s\n' '## Claim Gate' '' '**INCOMPLETE** — no trusted LAW.md.' > "$OUT/comment.md"
          return 1
        }

        if [ "$EVENT" = "pull_request" ]; then
          if [ ! -f LAW.md ]; then
            echo INCOMPLETE > "$OUT/verdict.txt"
            printf '%s\n' '## Claim Gate' '' '**INCOMPLETE** — this PR deletes LAW.md. Next base would have no policy.' > "$OUT/comment.md"
            cat "$OUT/comment.md"
            cp "$OUT/comment.md" "$GITHUB_WORKSPACE/claim-gate-comment.md"
            cp "$OUT/verdict.txt" "$GITHUB_WORKSPACE/claim-gate-verdict.txt"
            exit 0
          fi
          set +e
          python3 "$ACTION/gate.py" --lint-law LAW.md --out "$OUT"
          lint_rc=$?
          set -e
          if [ "$lint_rc" -ne 0 ]; then
            cat "$OUT/comment.md"
            cp "$OUT/comment.md" "$GITHUB_WORKSPACE/claim-gate-comment.md"
            cp "$OUT/verdict.txt" "$GITHUB_WORKSPACE/claim-gate-verdict.txt"
            exit 0
          fi
        fi

        if ! resolve_law; then
          cat "$OUT/comment.md"
        else
          CLAIM=""
          if [ -f claim.json ]; then
            cp claim.json "$OUT/claim.json"
            CLAIM="$OUT/claim.json"
          fi
          if [ -z "$CLAIM" ]; then
            echo INCOMPLETE > "$OUT/verdict.txt"
            printf '%s\n' '## Claim Gate' '' '**INCOMPLETE** — no claim.json. Skipping a claim is not ADMIT.' > "$OUT/comment.md"
            cat "$OUT/comment.md"
          else
            set +e
            python3 "$ACTION/gate.py" \
              --claim "$CLAIM" \
              --law "$OUT/LAW.md" \
              --out "$OUT" \
              --head-sha "$HEAD_SHA" \
              --base-sha "${BASE_SHA:-}" \
              --run-id "$RUN_ID"
            rc=$?
            set -e
            if [ ! -f "$OUT/verdict.txt" ] || [ ! -f "$OUT/comment.md" ]; then
              echo INCOMPLETE > "$OUT/verdict.txt"
              printf '%s\n' '## Claim Gate' '' '**INCOMPLETE** — judge crashed before writing a verdict.' > "$OUT/comment.md"
            fi
            cat "$OUT/comment.md"
            if [ "$rc" -ge 2 ]; then
              echo INCOMPLETE > "$OUT/verdict.txt"
            fi
          fi
        fi
        cp "$OUT/comment.md" "$GITHUB_WORKSPACE/claim-gate-comment.md"
        cp "$OUT/verdict.txt" "$GITHUB_WORKSPACE/claim-gate-verdict.txt"
    - uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request'
      with:
        header: claim-gate
        path: claim-gate-comment.md
    - name: Fail closed
      shell: bash
      run: test "$(tr -d '\n' < "${RUNNER_TEMP}/claim-gate/verdict.txt")" = "ADMIT"
